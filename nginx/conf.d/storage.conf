# s3.marjon.tech    → MinIO S3 API (:9000) — публичные URL файлов
# minio.marjon.tech → MinIO веб-консоль (:9001)
# HTTPS уже включён (ssl.conf) — эти блоки на 80-м порту только редиректят.

server {
    listen 80;
    listen [::]:80;
    server_name s3.marjon.tech;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name minio.marjon.tech;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}
