# marjon.tech      → статический лендинг (landing/index.html, privacy.html)
# api.marjon.tech  → reverse proxy на backend:8000 (FastAPI, вкл. WebSocket /ws/kitchen)
#
# Остальные поддомены (admin/s3/minio/payme/click/uzum) — в соседних
# файлах этой же папки. HTTPS уже включён (ssl.conf) — блоки ниже на 80-м
# порту только редиректят на https, реальная выдача — в ssl.conf.
#
# DNS на *.marjon.tech — wildcard, поэтому ЛЮБОЙ поддомен (в т.ч. случайный/
# несуществующий) резолвится на этот сервер. Без явного default_server
# nginx отдаёт такому запросу первый попавшийся server_name — например,
# админку. Блок ниже вместо этого молча рвёт соединение (444).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name marjon.tech www.marjon.tech;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.marjon.tech;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}
