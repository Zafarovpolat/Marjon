# admin.marjon.tech → собранный frontend/dist (см. ../../frontend/README-deploy.md).
# HTTPS уже включён (ssl.conf) — этот блок на 80-м порту только редиректит.

server {
    listen 80;
    listen [::]:80;
    server_name admin.marjon.tech;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}
