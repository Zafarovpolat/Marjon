# payme.marjon.tech / click.marjon.tech / uzum.marjon.tech
# → соответствующие gateway-сервисы. HTTPS уже включён (ssl.conf) — эти
# блоки на 80-м порту только редиректят.

server {
    listen 80;
    listen [::]:80;
    server_name payme.marjon.tech;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name click.marjon.tech;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name uzum.marjon.tech;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}
