# kitchen.marjon.tech — отдельный экран кухни (KDS) для поваров.
#
# Зачем отдельный домен: повару нужен один короткий адрес, и он не должен
# видеть интерфейс владельца. На этом хосте отдаётся ТОЛЬКО entry
# kitchen.html (свой Vite-бандл), без SPA-роутинга админки.
#
# Порядок включения:
#   1) DNS: A-запись kitchen.marjon.tech -> 95.182.119.150;
#   2) сертификат: docker compose run --rm --entrypoint certbot certbot
#      certonly --webroot -w /var/www/certbot --expand -d marjon.tech ... \
#      -d kitchen.marjon.tech   (сертификат общий, SAN расширяется);
#   3) docker compose exec nginx nginx -s reload.
#
# До появления DNS рабочий адрес кухни — https://admin.marjon.tech/kds.

server {
    listen 80;
    listen [::]:80;
    server_name kitchen.marjon.tech;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kitchen.marjon.tech;

    ssl_certificate     /etc/letsencrypt/live/marjon.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marjon.tech/privkey.pem;

    root /usr/share/nginx/html-admin;
    index kitchen.html;

    # Корень — сразу кухонный экран.
    location = / {
        try_files /kitchen.html =404;
    }

    # Прятать entry за длинным путём на этом хосте незачем: тут нет ничего,
    # кроме кухни.
    location = /kitchen.html {
        return 301 https://$host/;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Никакого fallback на index.html: на этом домене нет админки, и попытка
    # открыть /finance или /users должна давать 404, а не интерфейс владельца.
    location / {
        try_files $uri =404;
    }

    add_header Cache-Control "no-cache";
}
