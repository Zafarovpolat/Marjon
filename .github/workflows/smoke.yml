name: smoke

# Быстрая проверка на каждый push/PR: ловит ровно тот класс ошибок, что бил при
# реальном запуске (падение импорта, 500/422 на логине, поломка сборки) ДО того,
# как код попадёт на машину для теста.

on:
  push:
    branches: [front, main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (импорт, логин, тесты)
    runs-on: ubuntu-latest
    env:
      # Локальная БД в файле — общая для сидирования и смок-запроса, без Postgres.
      DATABASE_URL: "sqlite+aiosqlite:///./ci.db"
      SECRET_KEY: "ci-only-secret-key-at-least-32-characters"
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # целевая версия проекта (Dockerfile)
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Установить зависимости
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Импорт приложения ловит падения уровня старта (напр. ForwardRef от
      # slowapi+отложенных аннотаций). Прогоняем с двумя «неудобными» значениями
      # ALLOWED_ORIGINS — как их передаёт лаунчер (через запятую) и docker ("*").
      - name: Импорт с ALLOWED_ORIGINS через запятую
        working-directory: backend
        env:
          ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://192.168.1.5:5173"
        run: python -c "import app.main; print('import OK (comma origins)')"

      - name: Импорт с ALLOWED_ORIGINS="*"
        working-directory: backend
        env:
          ALLOWED_ORIGINS: "*"
        run: python -c "import app.main; print('import OK (wildcard origins)')"

      - name: Схема БД и демо-данные
        working-directory: backend
        run: |
          python create_tables.py
          python migrate_add_permissions.py
          python seed.py

      # Главный смок: приложение реально отвечает и логин выдаёт токен.
      # Разом ловит ForwardRef (не импортируется), 422 (валидатор сломан),
      # 500 (БД/прочее) — всё, что нас било.
      - name: Смок логина (ASGI, без сети)
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio, sys
          from httpx import ASGITransport, AsyncClient
          from app.main import app

          async def main():
              transport = ASGITransport(app=app)
              async with AsyncClient(transport=transport, base_url="http://test") as c:
                  r = await c.get("/docs")
                  assert r.status_code == 200, f"/docs -> {r.status_code}"

                  r = await c.post("/api/v1/auth/login",
                                   json={"phone": "+998900078779", "password": "102938"})
                  assert r.status_code == 200, f"login -> {r.status_code}: {r.text[:300]}"
                  assert "access_token" in r.json(), f"нет access_token: {r.text[:300]}"
              print("SMOKE OK: /docs=200, login=200, токен выдан")

          asyncio.run(main())
          PY

      - name: Юнит-тесты бэкенда (pytest, SQLite in-memory)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"   # изолируем от засиженной ci.db
        run: pip install pytest pytest-asyncio asgi-lifespan && pytest

  frontend:
    name: Frontend (тесты и сборка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # test:admin — структурные проверки на чистом Node (надёжно в CI).
      # Полный vitest (test:unit) в CI не гоняем: его jsdom/undici несовместим с
      # Node в раннере (webidl.markAsUncloneable) — это среда, а не тесты. vitest
      # запускается локально; здесь ловим регрессии структуры и сборкой.
      - name: Тесты (admin-структурные проверки)
        working-directory: frontend
        run: npm run test:admin

      - name: Production-сборка
        working-directory: frontend
        run: npm run build

  desktop:
    name: Desktop (сборка Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Установить зависимости
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # electron-vite build ловит поломки импортов (напр. отсутствующий 'ws',
      # битые пути после правок) без запуска GUI.
      - name: Сборка
        working-directory: desktop
        run: npm run build

  gateways:
    name: Платёжные шлюзы (Go build + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      # go build падает на неиспользуемых импортах и синтаксисе; go vet — на
      # подозрительных конструкциях. Ловит правки в подписи/сумме/ретраях, которые
      # нельзя собрать в песочнице агента.
      - name: Build + vet каждого шлюза
        run: |
          for svc in click-gateway payme-gateway uzum-gateway; do
            echo "== $svc =="
            (cd "services/$svc" && go mod tidy && go build ./... && go vet ./...)
          done

  mobile:
    name: Flutter (analyze mobile + owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # analyze с --no-fatal-* падает только на ОШИБКАХ (реальная поломка кода),
      # а не на пред-существующих warning/info — ловит регрессии без лишнего шума.
      - name: Analyze mobile
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Analyze owner
        working-directory: owner
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
