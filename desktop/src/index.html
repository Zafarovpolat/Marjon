<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <!-- Шрифты лежат локально (src/styles/fonts.css), внешние домены не нужны:
         терминал должен рисовать интерфейс без интернета. `data:` во font-src —
         на случай, если Vite заинлайнит мелкий woff2 в CSS (лимит 4 КБ). -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src *; img-src 'self' data: https:;" />
    <title>Marjon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
