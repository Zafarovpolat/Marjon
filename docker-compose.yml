# Marjon — локальный запуск в Docker.
#
#   docker compose up -d --build     # БД + бэкенд + веб (всё, что нужно для теста)
#   docker compose logs -f backend   # логи
#   docker compose down              # остановить (данные БД сохраняются)
#   docker compose down -v           # остановить и удалить данные
#
# Опциональные части (по профилям):
#   docker compose --profile storage  up -d   # + MinIO (загрузка аватаров/файлов)
#   docker compose --profile gateways up -d   # + платёжные шлюзы Payme/Click/Uzum
#   docker compose --profile ngrok    up -d   # + публичный туннель к MinIO
#
# Ничего настраивать вручную не нужно: пароли БД, миграции и демо-данные
# готовятся автоматически внутри контейнеров.

services:
  db:
    image: postgres:16-alpine
    container_name: marjon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: marjon
      POSTGRES_USER: marjon
      POSTGRES_PASSWORD: marjon_secret
    ports:
      # Наружу отдаём 55432, чтобы не конфликтовать с локально установленным
      # Postgres на 5432. Внутри сети контейнеров адрес остаётся db:5432.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marjon -d marjon"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: marjon-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Внутри сети контейнеров БД доступна по имени сервиса
      DATABASE_URL: postgresql+asyncpg://marjon:marjon_secret@db:5432/marjon
      SECRET_KEY: local-dev-secret-key-change-in-prod
      DEBUG: "true"
      PORT: "8000"
      # Веб ходит через nginx на том же origin, а десктоп/мобилка — напрямую с
      # произвольного адреса. Для локального теста разрешаем любой origin
      # (токены передаются заголовком Authorization, cookie не используются).
      ALLOWED_ORIGINS: "*"
      # Наполнить демо-данными при первом запуске (0 — не наполнять)
      SEED_ON_START: "1"
      # MinIO — только для загрузки аватаров; работает при профиле storage
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: marjon
      MINIO_SECRET_KEY: marjon_secret
      MINIO_BUCKET: marjon-media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 10

  frontend:
    build: ./frontend
    container_name: marjon-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    # nginx внутри контейнера проксирует /api и /ws на backend:8000,
    # поэтому веб работает с любого устройства без правки адресов и без CORS.

  # ── Опционально: хранилище файлов (профиль storage) ────────────────────────
  minio:
    # Тег зафиксирован: `latest` у MinIO меняется ежедневно и ломал запуск.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: marjon-minio
    profiles: ["storage", "ngrok"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: marjon
      MINIO_ROOT_PASSWORD: marjon_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # `mc` в образе minio/minio нет — проверяем HTTP-эндпоинт готовности.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: marjon-minio-init
    profiles: ["storage", "ngrok"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 marjon marjon_secret &&
        mc mb --ignore-existing local/marjon-media &&
        mc anonymous set public local/marjon-media &&
        echo 'MinIO bucket ready'
      "
    restart: "no"

  # ── Опционально: публичный туннель к MinIO (профиль ngrok) ────────────────
  # Требует NGROK_AUTHTOKEN, поэтому по умолчанию не запускается.
  ngrok-minio:
    image: ngrok/ngrok:latest
    container_name: marjon-ngrok
    profiles: ["ngrok"]
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http minio:9000 --domain=flounder-precious-vervet.ngrok-free.app --log stdout
    ports:
      - "4040:4040"

  # ── Опционально: платёжные шлюзы (профиль gateways) ───────────────────────
  payme-gateway:
    build: ./services/payme-gateway
    container_name: marjon-payme
    profiles: ["gateways"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      DATABASE_URL: postgres://marjon:marjon_secret@db:5432/marjon?sslmode=disable
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-dev-webhook-secret}
      BACKEND_URL: http://backend:8000/api/v1

  click-gateway:
    build: ./services/click-gateway
    container_name: marjon-click
    profiles: ["gateways"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "8002:8002"
    environment:
      PORT: "8002"
      DATABASE_URL: postgres://marjon:marjon_secret@db:5432/marjon?sslmode=disable
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-dev-webhook-secret}
      BACKEND_URL: http://backend:8000/api/v1

  uzum-gateway:
    build: ./services/uzum-gateway
    container_name: marjon-uzum
    profiles: ["gateways"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "8003:8003"
    environment:
      PORT: "8003"
      DATABASE_URL: postgres://marjon:marjon_secret@db:5432/marjon?sslmode=disable
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-dev-webhook-secret}
      BACKEND_URL: http://backend:8000/api/v1

volumes:
  pgdata:
  minio_data:
