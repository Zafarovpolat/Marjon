<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Marjon · Login — Вариант A «Aurora Focus»</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ── Токены Marjon (значения из global/marjon-tokens.css) ── */
  :root{
    --teal-500:#1db5b5; --teal-400:#22d3ee; --teal-600:#0fa3a3; --teal-700:#0e8080; --teal-800:#0d6262;
    --navy-950:#071428; --navy-900:#0b1f3f; --navy-800:#162840; --muted:#7a94b4;
    --bg:#f4f7fc; --card:#fff; --text:#e7e8eb; --danger:#ef4444;
    --font-display:"Manrope",sans-serif; --font-body:"Golos Text","Manrope",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--font-body); color:var(--text);
    background:var(--navy-950);
    min-height:100dvh; display:grid; place-items:center; padding:32px 20px;
    position:relative; overflow:hidden;
  }
  /* Аврора: мягкие тёплые teal-пятна, без неона */
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
  body::before{width:520px;height:520px;top:-160px;right:-120px;background:radial-gradient(circle,rgba(29,181,181,.28),transparent 70%)}
  body::after{width:460px;height:460px;bottom:-180px;left:-120px;background:radial-gradient(circle,rgba(15,163,163,.20),transparent 70%)}

  /* Переключатель языка — прижат к правому верхнему углу */
  .lang{position:fixed;top:24px;right:28px;display:flex;gap:6px;z-index:3}
  .lang button{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.04);color:var(--muted);border-radius:10px;font:500 12px var(--font-body);cursor:pointer;transition:.2s}
  .lang button img{width:20px;height:13px;border-radius:3px;object-fit:cover}
  .lang button.is-active,.lang button:hover{color:#fff;border-color:rgba(29,181,181,.5);background:rgba(29,181,181,.10)}

  /* Центральная колонка */
  .shell{position:relative;z-index:2;width:100%;max-width:400px;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:36px}
  .brand .mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(140deg,var(--teal-400),var(--teal-600));color:var(--navy-950);font:700 24px var(--font-display)}
  .brand span{font:700 20px var(--font-display);letter-spacing:-.01em}

  h1{margin:0 0 8px;font:700 28px var(--font-display);letter-spacing:-.02em;color:#fff}
  .sub{margin:0 0 32px;font:400 16px var(--font-body);color:var(--muted)}

  /* Стеклянная панель формы (liquid-glass: 1px внутренняя грань + верхний блик) */
  form{display:grid;gap:16px;text-align:left;padding:28px;border-radius:20px;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 60px -30px rgba(0,0,0,.6)}
  label{display:grid;gap:8px}
  label > .cap{font:400 12px var(--font-body);color:var(--muted);letter-spacing:.02em}
  .wrap{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-radius:13px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);transition:.2s}
  .wrap:focus-within{border-color:var(--teal-500);box-shadow:inset 0 0 0 1px rgba(29,181,181,.5)}
  .wrap svg{width:18px;height:18px;color:var(--muted);flex:none}
  .wrap .pfx{font:500 15px var(--font-body);color:#fff}
  .wrap input{flex:1;min-width:0;border:0;background:none;outline:none;color:#fff;font:400 16px var(--font-body)}
  .wrap input::placeholder{color:var(--muted)}
  .eye{border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:4px}
  .eye:hover{color:var(--teal-400)}

  .row{display:flex;align-items:center;justify-content:space-between;font:400 12px var(--font-body)}
  .chk{display:flex;align-items:center;gap:8px;color:var(--text);cursor:pointer}
  .chk input{width:16px;height:16px;accent-color:var(--teal-500)}
  .forgot{color:var(--teal-400);text-decoration:none}
  .forgot:hover{text-decoration:underline}

  .submit{height:54px;border:0;border-radius:14px;cursor:pointer;color:#fff;font:700 16px var(--font-display);
    background:linear-gradient(135deg,var(--teal-600),var(--teal-800));transition:transform .1s,filter .2s}
  .submit:hover{filter:brightness(1.08)}
  .submit:active{transform:translateY(1px) scale(.99)}
</style>
</head>
<body>
  <nav class="lang">
    <button><img src="https://flagcdn.com/w40/uz.png" alt="" />UZ</button>
    <button class="is-active"><img src="https://flagcdn.com/w40/ru.png" alt="" />RU</button>
    <button><img src="https://flagcdn.com/w40/gb.png" alt="" />EN</button>
  </nav>

  <main class="shell">
    <div class="brand">
      <div class="mark">M</div>
      <span translate="no">Marjon</span>
    </div>

    <h1>С возвращением</h1>
    <p class="sub">Войдите, чтобы управлять рестораном</p>

    <form onsubmit="return false">
      <label>
        <span class="cap">Номер телефона</span>
        <div class="wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.6 10.8a13 13 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11 11 0 0 0 3.5.56 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11 11 0 0 0 .56 3.5 1 1 0 0 1-.24 1z"/></svg>
          <strong class="pfx">+998</strong>
          <input type="tel" inputmode="numeric" placeholder="90 123-45-67" />
        </div>
      </label>

      <label>
        <span class="cap">Пароль</span>
        <div class="wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" placeholder="Введите пароль" />
          <button type="button" class="eye" aria-label="Показать пароль">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </label>

      <div class="row">
        <label class="chk"><input type="checkbox" checked /> Запомнить меня</label>
        <a class="forgot" href="#">Забыли пароль?</a>
      </div>

      <button class="submit" type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
